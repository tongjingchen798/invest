# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8081
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  # jackson时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    password:    # 密码（默认为空）
    timeout: 6000ms  # 连接超时时长（毫秒）
    jedis:
      pool:
        max-active: 1000  # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1ms      # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10      # 连接池中的最大空闲连接
        min-idle: 5       # 连接池中的最小空闲连接

renren:
  redis:
    open: false  # 是否开启redis缓存  true开启   false关闭


#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: io.renren.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE

# 投资收益配置
investment:
  profit:
    # 到期收益含本金的年化收益率
    maturity-annual-rate: 0.12
    # 每日返本金到期收益的年化收益率
    daily-return-annual-rate: 0.08
    # 不返本金的年化收益率
    no-principal-annual-rate: 0.15
    # 复利产品的日收益率
    compound-daily-rate: 0.0003
    # 阶梯日益的收益率配置
    stepped-daily-rate:
      # 前7天的日收益率
      first-week-rate: 0.001
      # 8-15天的日收益率
      second-week-rate: 0.0015
      # 16天以后的日收益率

# 提现规则配置
withdraw:
  # 单笔最低提现额度（卢比*100）
  min-amount: 20000
  # 单笔最高提现额度（卢比*100）
  max-amount: 10000000
  # 提现手续费率（百分比）
  fee-rate: 5
  # 手续费计算方式：true为按比例，false为固定金额
  percentage-fee: true
  # 固定手续费金额（卢比），当percentage-fee为false时使用
  fixed-fee: 0

# 佣金配置
commission:
  # 1级直属推荐佣金比例（百分比）
  first-level-rate: 7
  # 2级推荐佣金比例（百分比）
  second-level-rate: 3
  # 是否启用佣金计算
  enabled: true
  # 佣金计算时间（每天凌晨几点执行）
  cron-expression: "0 0 2 * * ?"